name: Build and publish Docker image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Split into stages so each job stays under GHA's ~6h limit.
# Intermediate images are pushed to GHCR so later jobs can continue from them.

jobs:
  x64-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          docker-images: false
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          # Keep swap: removing it makes long vcpkg Docker builds OOM the runner.
          swap-storage: false

      - name: Ensure swap for link peaks
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=ci-x64-linux
            type=raw,value=ci-x64-linux-${{ github.sha }}

      - uses: docker/build-push-action@v5
        id: push
        with:
          context: .
          target: x64-linux
          # Always push intermediates so the next job can FROM them via registry cache.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Avoid mode=max GHA export of multi-GB layers (starves runner network/RAM).
          # Registry push + sha tag is the handoff to the next job.
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=x64-linux
            type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:ci-x64-linux
          cache-to: type=gha,scope=x64-linux,mode=min
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  wasm:
    needs: x64-linux
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          docker-images: false
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Ensure swap for link peaks
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=ci-wasm
            type=raw,value=ci-wasm-${{ github.sha }}

      - uses: docker/build-push-action@v5
        id: push
        with:
          context: .
          target: wasm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse the pushed x64-linux stage as this job's x64-linux FROM (do not rebuild).
          build-contexts: |
            x64-linux=docker-image://ghcr.io/${{ env.IMAGE_NAME }}:ci-x64-linux-${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=wasm
            type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:ci-wasm
          cache-to: type=gha,scope=wasm,mode=min
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  final:
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          docker-images: false
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Ensure swap for link peaks
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - uses: docker/build-push-action@v5
        id: push
        with:
          context: .
          target: final
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Continue from the pushed wasm stage.
          build-contexts: |
            wasm=docker-image://ghcr.io/${{ env.IMAGE_NAME }}:ci-wasm-${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=final
            type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-to: type=gha,scope=final,mode=min
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - uses: actions/attest-build-provenance@v1
        if: github.event_name != 'pull_request'
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
